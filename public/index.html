   if(!/^\d{12}$/.test(u)){er.textContent="Please enter the 12-digit UTR from your UPI app";return}
   b.textContent="Checking…";api("/api/upi-claim",{method:"POST",body:{kind:kind,quiz:quiz,utr:u}}).then(function(v){next(v.pass)}).catch(function(e){b.textContent="I paid ✅";er.textContent=e.message})};
  return;
 }
 app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="card"><h2>Pay ₹'+pr+' to '+label+' 💸</h2><p>One tiny payment for a big giggle!</p><p><span class="price">₹'+pr+'</span></p><button class="pk pulse" id="pp">Pay with UPI 💖</button><button class="alt" id="bk">Back</button><small>Secure payment by Razorpay · UPI, cards, wallets</small></div>';
 document.getElementById("pp").onclick=function(){var b=this;b.textContent="Opening payment…";startPayment(kind,quiz,next,function(m){b.textContent=m+" · tap to try again"})};
 document.getElementById("bk").onclick=back;
}
/* ===== screens ===== */
function splash(cb){app.innerHTML='<div style="margin-top:12vh"><div class="pal">'+P1+P2+'</div><div class="logo">Don’t <b>Block</b> Me</div><p>loading cuteness…</p><div class="ld"><i></i></div>'+dots()+'</div>';setTimeout(cb,1900)}
function home(){
 app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="logo">Don’t <b>Block</b> Me</div><span class="tag">Find your fake friends 💔</span><div class="bub">Will I block you? 🥺💖</div>'+
 '<div class="card"><h2>Create your quiz ✨</h2><p>Use our cute questions or write your own. Friends guess your answers!</p><button class="pulse" id="cr">create quiz ➜</button><button class="pk" id="sb">🏆 Friends’ scores</button></div>'+
 '<div class="card"><h2>How to play? 🎀</h2><p>✍️ <b>Create</b> your quiz and pick your answers</p><p>📤 <b>Share</b> on WhatsApp, Insta or Snapchat</p><p>🏆 <b>Block</b> friends with low scores 🚫</p></div>'+
 '<p><small>We count visits and plays to improve the game. <a href="/policies.html#privacy">Privacy</a> · <a href="/policies.html#terms">Terms</a> · <a href="/policies.html#refund">Refunds</a></small></p>';
 document.getElementById("cr").onclick=nameScreen;document.getElementById("sb").onclick=board;
}
function nameScreen(){
 track("start_create");
 app.innerHTML='<div class="pal">'+P1+'</div><div class="card"><h2>What’s your name? 🌸</h2><input id="nm" maxlength="15" placeholder="name…"><button id="go">continue ➜</button><button class="alt" id="bk">Back</button></div>';
 var nm=document.getElementById("nm");document.getElementById("bk").onclick=home;
 document.getElementById("go").onclick=function(){var n=nm.value.trim();if(!n){nm.focus();return}mode(n)};
}
function mode(n){
 app.innerHTML='<div class="pal">'+P2+'</div><div class="card"><h2>Pick your questions 💭</h2><button class="pk" id="rd">🎀 Ready-made (16 cute ones)</button><button id="ow">✏️ Write my own questions</button><button class="alt" id="bk">Back</button></div>';
 document.getElementById("rd").onclick=function(){payScreen("create your quiz","create",null,function(pass){quiz(n,null,Q,pass)},function(){mode(n)})};
 document.getElementById("ow").onclick=function(){builder(n,[])};
 document.getElementById("bk").onclick=nameScreen;
}
function builder(n,list){
 var rm=list.rm||0,ex=list.ex||0,MAX=40,E=EX[ex%EX.length];
 var done=list.map(function(x,i){return'<div class="q"><span class="rx" data-i="'+i+'">✖</span> '+(i+1)+'. '+esc(x[0])+'</div>'}).join("");
 var emo=["💖","😍","🥺","😂","🍕","🍫","🍦","🐶","🐱","🐰","🌈","⭐","🎀","🎮","🎬","☕","🧋","🌸","🔥","😴"].map(function(e){return'<button class="em" type="button">'+e+'</button>'}).join("");
 app.innerHTML='<div class="pal">'+P1+'</div><div class="card"><h2>Question '+(list.length+1)+' ✏️</h2><small>'+list.length+'/'+MAX+' added · at least 3 needed · 2–4 options each</small>'+
 '<div class="ex">💡 <b>Example · '+esc(E[2])+'</b><br>'+esc(E[0])+'<br><small>'+esc(E[1].join("  ·  "))+'</small><button class="alt sm" id="ue">Use this example ✨</button><button class="alt sm" id="ne">🔄 Another example</button></div>'+
 '<input id="bq" maxlength="80" placeholder="your question… 💭"><input id="b0" maxlength="24" placeholder="option 1 🍕"><input id="b1" maxlength="24" placeholder="option 2 🍫"><input id="b2" maxlength="24" placeholder="option 3 (optional)"><input id="b3" maxlength="24" placeholder="option 4 (optional)">'+
 '<p style="margin-bottom:0"><small>Tap an emoji to add it 👇</small></p><div>'+emo+'</div>'+
 '<button class="pk" id="ad">➕ Add this question</button>'+(rm<Q.length?'<button id="rb">🎀 Add 5 ready-made questions</button>':'')+
 '<button id="dn" '+(list.length<3?'style="opacity:.5"':'')+'>Done ('+list.length+' questions) ➜</button><button class="alt" id="bk">Back</button>'+(done?'<div style="margin-top:12px"><small>Tap ✖ to remove</small>'+done+'</div>':'')+'</div>';
 var last=document.getElementById("bq");
 ["bq","b0","b1","b2","b3"].forEach(function(id){document.getElementById(id).addEventListener("focus",function(){last=this})});
 Array.prototype.forEach.call(document.querySelectorAll(".em"),function(b){b.addEventListener("mousedown",function(e){e.preventDefault()});b.onclick=function(){if(last.value.length<last.maxLength)last.value+=b.textContent;beep(900,.1,"sine")}});
 Array.prototype.forEach.call(document.querySelectorAll(".rx"),function(s){s.onclick=function(){list.splice(+s.getAttribute("data-i"),1);builder(n,list)}});
 document.getElementById("ue").onclick=function(){document.getElementById("bq").value=E[0];E[1].forEach(function(t,i){document.getElementById("b"+i).value=t})};
 document.getElementById("ne").onclick=function(){list.ex=ex+1;builder(n,list)};
 function get(){var q=document.getElementById("bq").value.trim(),o=[0,1,2,3].map(function(i){return document.getElementById("b"+i).value.trim()}).filter(Boolean);return o.length>=2&&q?[q,o]:null}
 document.getElementById("ad").onclick=function(){var x=get();if(!x){document.getElementById("bq").focus();return}if(list.length>=MAX)return;list.push(x);builder(n,list)};
 var rb=document.getElementById("rb");if(rb)rb.onclick=function(){var x=get();if(x&&list.length<MAX)list.push(x);for(var i=rm;i<rm+5&&i<Q.length&&list.length<MAX;i++)list.push(Q[i]);list.rm=rm+5;builder(n,list)};
 document.getElementById("dn").onclick=function(){var x=get();if(x&&list.length<MAX)list.push(x);if(list.length<3){builder(n,list);return}payScreen("create your quiz","create",null,function(pass){quiz(n,null,list,pass)},function(){builder(n,list)})};
 document.getElementById("bk").onclick=function(){mode(n)};
}
function quiz(name,target,qs,pass){
 var QS=target?target.q:qs,i=0,ans=[];
 (function step(){
  if(i>=QS.length)return target?submit():finish();
  var q=QS[i],w=i%2?"p":"t";
  app.innerHTML='<div class="bar"><i style="width:'+i/QS.length*100+'%"></i></div><div class="card"><small>Question '+(i+1)+'/'+QS.length+'</small><div class="sp">'+(w==="t"?P1:P2)+'<div class="bub2">'+(target?"<small>Guess "+esc(target.n)+"’s answer 🤔</small><br>":"")+esc(q[0])+'</div></div><div class="opts" id="o"></div></div>';
  q[1].forEach(function(t,k){var b=document.createElement("button");b.className="c"+k%4;b.style.animationDelay=k*.07+"s";b.textContent=t;b.onclick=function(){ans.push(k);i++;step()};document.getElementById("o").appendChild(b)});
 })();
 function submit(){wait("checking your answers…");api("/api/quiz/"+encodeURIComponent(target.id)+"/play",{method:"POST",headers:{"x-pass":pass},body:{player:name,guesses:ans}}).then(function(r){playEnd(name,target,r.score,r.total)}).catch(function(e){fail(e.message+" (if you were charged, email us your payment ID)")})}
 function finish(){wait("making your quiz…");api("/api/quiz",{method:"POST",headers:{"x-pass":pass},body:{name:name,questions:QS,answers:ans}}).then(function(r){MY.push({id:r.id,key:r.key,name:name});saveMy();createEnd(name,r.id)}).catch(function(e){fail(e.message+" (if you were charged, email us your payment ID)")})}
}
function createEnd(name,id){
 confetti();var url=location.origin+"/?q="+id;
 app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="card"><h2>Your quiz is ready, '+esc(name)+'! 🎉</h2><p>Send this link to your friends:</p><div class="link">'+esc(url)+'</div><button class="pk pulse" id="sh">Share link 📤</button><button class="alt" id="cp">Copy link 📋</button><button id="lb">🏆 Friends’ scores</button><button class="alt" id="hm">Home</button></div>';
 var txt="Do you really know me? 💖 Take my quiz and see if I block you 🚫📱";
 function cp(){try{navigator.clipboard.writeText(txt+" "+url);document.getElementById("cp").textContent="Copied ✅"}catch(e){}}
 document.getElementById("sh").onclick=function(){if(navigator.share){navigator.share({title:"Don’t Block Me",text:txt,url:url}).catch(function(){})}else cp()};
 document.getElementById("cp").onclick=cp;document.getElementById("lb").onclick=board;document.getElementById("hm").onclick=goHome;
}
function playEnd(me,t,sc,n){
 var p=sc/n;
 var r=p>=.75?["💖","Real bestie!","You know "+esc(t.n)+" so well. Never blocked!"]:p>=.45?["🌸","Good friend","Not bad! "+esc(t.n)+" keeps you… for now."]:["🚫","BLOCKED!","Fake friend alert! "+esc(t.n)+" just blocked you 💔"];
 if(p>=.45)confetti();
 app.innerHTML='<div class="pal">'+(p>=.45?P1+P2:P2)+'</div><div class="card"><div style="font-size:3.4rem">'+r[0]+'</div><h2>'+esc(me)+': '+r[1]+'</h2><div class="score">'+sc+'/'+n+'</div><p>'+r[2]+'</p><p><small>Your score was sent to '+esc(t.n)+' 💌</small></p><button class="pk" id="mk">Your turn! Make your own quiz ✨</button><button class="alt" id="hm">Home</button></div>';
 document.getElementById("mk").onclick=function(){nameScreen()};document.getElementById("hm").onclick=goHome;
}
function friend(t){
 track("start_play",t.id);
 app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="card"><h2>'+esc(t.n)+' is blocking fake friends 🚫📱</h2><p>Will '+esc(t.n)+' block you too? Let’s see! 👇</p><input id="nm" maxlength="15" placeholder="your name…"><button class="pulse" id="go">play now ➜</button></div>';
 document.getElementById("go").onclick=function(){var n=document.getElementById("nm").value.trim();if(!n){document.getElementById("nm").focus();return}payScreen("play","play",t.id,function(pass){quiz(n,t,null,pass)},function(){friend(t)})};
}
function board(){
 wait("loading scores…");
 Promise.all(MY.map(function(m){return api("/api/quiz/"+encodeURIComponent(m.id)+"/scores",{headers:{"x-key":m.key}}).catch(function(){return null})})).then(function(rs){
  var html="";rs.forEach(function(r){if(!r)return;html+='<div class="card"><h2>'+esc(r.name)+'’s quiz 🧸</h2><small>'+r.scores.length+' friend'+(r.scores.length===1?'':'s')+' played</small>'+(r.scores.length?r.scores.map(function(x,i){var p=x.score/x.total;return'<div class="rw"><span>'+(["🥇","🥈","🥉"][i]||(i+1)+".")+' '+esc(x.player)+'</span><span>'+x.score+'/'+x.total+' '+(p>=.75?"💖":p>=.45?"🌸":"🚫")+'</span></div>'}).join(""):'<p>No scores yet. Share your quiz link! 💌</p>')+'</div>'});
  app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="logo">🏆 Scores</div>'+(html||'<div class="card"><p>You have not created a quiz on this phone yet. Make one first! 🎀</p></div>')+'<button class="alt" id="hm">Home</button>';
  document.getElementById("hm").onclick=goHome});
}
function route(){
 var q=new URLSearchParams(location.search).get("q");track("open",q);
 if(!q)return home();
 api("/api/quiz/"+encodeURIComponent(q)).then(friend).catch(function(){goHome()});
}
api("/api/config").then(function(c){CFG=c}).catch(function(){}).then(function(){splash(route)});
})();
</script>
</body>
