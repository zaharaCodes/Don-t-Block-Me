 document.getElementById("rm").onclick=function(){quiz(me,t,null,null)};
 document.getElementById("nt").onclick=function(){var nl=document.getElementById("nl");nl.hidden=!nl.hidden;nl.innerHTML="";NOTES.forEach(function(tx,k){var b=document.createElement("button");b.className="alt sm";b.textContent=tx;b.onclick=function(){api("/api/quiz/"+encodeURIComponent(t.id)+"/note",{method:"POST",body:{i:k}}).then(function(){nl.innerHTML='<p><b>💌 Sent anonymously!</b></p>'}).catch(function(e){nl.innerHTML='<p>'+esc(e.message)+'</p>'});};nl.appendChild(b)})};
 document.getElementById("mk").onclick=function(){nameScreen()};document.getElementById("hm").onclick=goHome;
}
function friend(t){
 track("start_play",t.id);document.title=t.n+" is blocking fake friends 🚫📱";
 app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="card"><h2>'+esc(t.n)+' is blocking fake friends 🚫📱</h2><p>Will '+esc(t.n)+' block you too? Let’s see! 👇</p><p><b>🎮 Free to play!</b></p><input id="nm" maxlength="15" placeholder="your name…"><button class="pulse" id="go">play now ➜</button></div>';
 document.getElementById("go").onclick=function(){var n=document.getElementById("nm").value.trim();if(!n){document.getElementById("nm").focus();return}quiz(n,t,null,null)};
}
function addMine(id,key){if(!MY.some(function(m){return m.id===id})){MY.push({id:id,key:key,name:""});saveMy()}}
function fl(r){if(!r.scores.length)return"";var f=r.scores.filter(function(x){return x.score/x.total<.45});return'<h2 style="font-size:1.1rem;margin-top:14px">💔 Fake friend list</h2>'+(f.length?f.map(function(x){return'<div class="wr">🚫 '+esc(x.player)+' ('+x.score+'/'+x.total+')</div>'}).join(""):'<p>🎉 No fake friends yet!</p>')}
function nt(r){return(r.notes&&r.notes.length)?'<h2 style="font-size:1.1rem;margin-top:14px">💌 Secret sweet notes</h2>'+r.notes.map(function(x){return'<div class="wr">'+esc(x.text)+'</div>'}).join(""):""}
function board(){
 wait("loading scores…");
 Promise.all(MY.map(function(m){return api("/api/quiz/"+encodeURIComponent(m.id)+"/scores",{headers:{"x-key":m.key}}).catch(function(){return null})})).then(function(rs){
  var html="";
  rs.forEach(function(r,qi){if(!r)return;
   html+='<div class="card"><h2>'+esc(r.name)+'’s page 🧸</h2><small>'+r.scores.length+' friend'+(r.scores.length===1?'':'s')+' played · tap a name to see their wrong guesses</small>'+
   (r.scores.length?r.scores.map(function(x,i){var p=x.score/x.total,k=qi+"-"+i,det="";
    if(x.wrong&&x.wrong.length)det=x.wrong.map(function(w){return'<div class="wr">'+esc(w.q)+'<br>😅 '+esc(x.player)+' said: <b>'+esc(w.yours)+'</b><br>✅ Right answer: <b>'+esc(w.correct)+'</b></div>'}).join("");
    else if(x.wrong)det='<div class="wr">🎉 Got every answer right!</div>';
    else det='<div class="wr">Details were not saved for this older play.</div>';
    return'<div class="rw tp" data-k="'+k+'"><span>'+(i===0?"👑 ":"")+(["🥇","🥈","🥉"][i]||(i+1)+".")+' '+esc(x.player)+'</span><span>'+x.score+'/'+x.total+' '+(p>=.75?"💖":p>=.45?"🌸":"🚫")+'</span></div><div class="dt" id="d'+k+'" hidden>'+det+'</div>'}).join(""):'<p>No scores yet. Share your link! 💌</p>')+fl(r)+nt(r)+'</div>'});
  app.innerHTML='<div class="pal">'+P1+P2+'</div><div class="logo">🏆 Scores</div>'+(html||'<div class="card"><p>No scores saved on this phone. If you made a quiz on another phone or browser, paste your private scores link below 👇</p></div>')+
   '<div class="card"><h2>Got a private scores link? 🔒</h2><input id="ml" placeholder="paste it here"><button class="pk" id="ad">Add my scores</button><p id="er" style="color:var(--pink)"></p></div><button class="alt" id="hm">Home</button>';
  Array.prototype.forEach.call(document.querySelectorAll(".tp"),function(el){el.onclick=function(){var d=document.getElementById("d"+el.getAttribute("data-k"));d.hidden=!d.hidden}});
  document.getElementById("ad").onclick=function(){var m=/[?&]m=([\w-]+)\.([\w-]+)/.exec(document.getElementById("ml").value);if(!m){document.getElementById("er").textContent="That doesn’t look like a scores link";return}addMine(m[1],m[2]);board()};
  document.getElementById("hm").onclick=goHome});
}
function route(){
 var sp=new URLSearchParams(location.search),mq=sp.get("m"),mm=mq&&/^([\w-]+)\.([\w-]+)$/.exec(mq);
 if(mm){addMine(mm[1],mm[2]);try{history.replaceState({},"","/")}catch(e){}track("open");return board()}
 var q=sp.get("q");track("open",q);
 if(!q)return home();
 api("/api/quiz/"+encodeURIComponent(q)).then(friend).catch(function(){goHome()});
}
api("/api/config").then(function(c){CFG=c}).catch(function(){}).then(function(){splash(route)});
})();
</script>
</body>
</html>
